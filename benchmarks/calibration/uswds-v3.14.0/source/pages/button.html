<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Button component</title><link rel="stylesheet" href="../assets/uswds/css/uswds.css"></head>
  <body><main class="grid-container usa-section"><h1>Button examples</h1><div class="grid-row grid-gap-2"><div class="tablet:grid-col-4"><h2>Default</h2><button class="usa-button" type="button">Default</button><button class="usa-button" type="button" disabled>Disabled</button></div><div class="tablet:grid-col-4"><h2>Secondary</h2><button class="usa-button usa-button--secondary" type="button">Secondary</button><button class="usa-button usa-button--outline" type="button">Outline</button></div><div class="tablet:grid-col-4"><h2>Large</h2><button class="usa-button usa-button--big" type="button">Big button</button><button class="usa-button usa-button--unstyled" type="button">Unstyled button</button></div></div></main></body>
</html>
